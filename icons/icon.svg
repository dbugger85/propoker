<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs>
<!-- Same style as PrimeTime's icon: a glossy gradient, a glass disc with a rim light, a white symbol -->
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3cc27a"/><stop offset=".55" stop-color="#14804c"/><stop offset="1" stop-color="#0b5566"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#032b1a" flood-opacity=".45"/></filter>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="256" r="174" fill="#fff" fill-opacity=".18" filter="url(#sh)"/>
<circle cx="256" cy="256" r="174" fill="none" stroke="url(#rim)" stroke-width="6"/>
<ellipse cx="256" cy="152" rx="116" ry="52" fill="#fff" opacity=".2"/>
<!-- The spade -->
<path transform="translate(256 249) scale(1.2) translate(-256 -259)" d="M256 168 C238 202 172 236 172 282 C172 316 202 334 230 326 C240 323 247 316 250 308 C248 326 240 338 222 350 L290 350 C272 338 264 326 262 308 C265 316 272 323 282 326 C310 334 340 316 340 282 C340 236 274 202 256 168 Z" fill="#fff"/>
<rect width="512" height="512" fill="url(#sheen)" opacity=".55"/>
</svg>
